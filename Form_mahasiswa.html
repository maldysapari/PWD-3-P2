<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Data Mahasiswa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        fieldset {
            border: 1px solid #777;
            margin-bottom: 20px;
            padding: 15px;
            width: 500px;
        }
        legend {
            font-weight: normal;
        }
        .form-group {
            margin-bottom: 10px;
            display: flex;
            align-items: flex-start;
        }
        .label {
            width: 140px;
            display: inline-block;
        }
        .colon {
            width: 20px;
            display: inline-block;
        }
        .input-control {
            flex-grow: 1;
        }
        input[type="text"], select, textarea {
            width: 250px;
            padding: 2px;
            box-sizing: border-box;
        }
        textarea {
            width: 280px;
            height: 70px;
            resize: both;
        }
        .checkbox-group, .radio-group {
            display: inline-block;
        }
        .checkbox-line {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <form>
        <!-- Data Mahasiswa Section -->
        <fieldset>
            <legend>Data Mahasiswa</legend>
            <div class="form-group">
                <span class="label">Nama</span>
                <span class="colon">:</span>
                <input type="text" name="nama">
            </div>
            <div class="form-group">
                <span class="label">NPM</span>
                <span class="colon">:</span>
                <input type="text" name="npm">
            </div>
            <div class="form-group">
                <span class="label">Kelas</span>
                <span class="colon">:</span>
                <select name="kelas">
                    <option value=""disabled selected hidden></option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="c">C</option>
                </select>
            </div>
            <div class="form-group">
                <span class="label">Jenis Kelamin</span>
                <span class="colon">:</span>
                <div class="radio-group">
                    <label><input type="radio" name="jk" value="Pria"> Pria</label>
                    <label><input type="radio" name="jk" value="Wanita"> Wanita</label>
                </div>
            </div>
        </fieldset>

        <!-- Tempat Tinggal Mahasiswa Section -->
        <fieldset>
            <legend>Tempat Tinggal Mahasiswa</legend>
            <div class="form-group">
                <span class="label">Alamat</span>
                <span class="colon">:</span>
                <textarea name="alamat"></textarea>
            </div>
            <div class="form-group">
                <span class="label">Kecamatan</span>
                <span class="colon">:</span>
                <input type="text" name="kecamatan">
            </div>
            <div class="form-group">
                <span class="label">Kabupaten/Kota</span>
                <span class="colon">:</span>
                <input type="text" name="kabupaten">
            </div>
            <div class="form-group">
                <span class="label">Provinsi</span>
                <span class="colon">:</span>
                <input type="text" name="provinsi">
            </div>
            <div class="form-group">
                <span class="label">Kode Pos</span>
                <span class="colon">:</span>
                <input type="text" name="kodepos">
            </div>
        </fieldset>

        <!-- Lain-lainya Section -->
        <fieldset>
            <legend>Lain-lainya</legend>
            <div class="form-group">
                <span class="label">Bahasa Pemrograman</span>
                <span class="colon">:</span>
                <div class="checkbox-group">
                    <div class="checkbox-line">
                        <label><input type="checkbox" name="bahasa[]" value="C/C++"> C/C++</label>
                        <label style="margin-left: 10px;"><input type="checkbox" name="bahasa[]" value="Go Lang"> Go Lang</label>
                        <label style="margin-left: 10px;"><input type="checkbox" name="bahasa[]" value="Python"> Python</label>
                    </div>
                    <div class="checkbox-line">
                        <label><input type="checkbox" name="bahasa[]" value="Lainnya"> Lainnya</label>
                    </div>
                    <div class="checkbox-line">
                        <label><input type="checkbox" name="bahasa[]" value="PHP"> PHP</label>
                        <label style="margin-left: 10px;"><input type="checkbox" name="bahasa[]" value="Javascript"> Javascript</label>
                        <label style="margin-left: 10px;"><input type="checkbox" name="bahasa[]" value="Ruby"> Ruby</label>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <span class="label">Kegiatan</span>
                <span class="colon">:</span>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="kegiatan[]" value="Organisasi Kemahasiswaan"> Organisasi Kemahasiswaan</label>
                    <br>
                    <label><input type="checkbox" name="kegiatan[]" value="Bidang Olahraga"> Bidang Olahraga</label>
                    <label style="margin-left: 10px;"><input type="checkbox" name="kegiatan[]" value="Lainnya"> Lainnya</label>
                </div>
            </div>
        </fieldset>
    </form>

</body>
</html>
